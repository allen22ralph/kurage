name: jellyfin_client
description: "Kurage, a Jellyfin client for Windows, Android phones and Android TV."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cached_network_image: ^4.0.5
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  google_fonts: ^9.0.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3

# media_kit's Android libmpv, patched to the "full" variant so PGS / DVD
# subtitles decode; see third_party/media_kit_libs_android_video/JELLYFIN_CLIENT.md.
dependency_overrides:
  media_kit_libs_android_video:
    path: third_party/media_kit_libs_android_video

flutter:
  uses-material-design: true
