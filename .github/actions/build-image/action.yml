name: Build image
description: >
  Builds the pinned build image (tool/docker/Dockerfile) under the tag
  build.sh expects, reusing layers from the GitHub Actions cache.
runs:
  using: composite
  steps:
    # The image (NDK + Flutter) is several GB and loading it doubles that;
    # the runner's ~14 GB free isn't enough. Drop preinstalled toolchains
    # we don't use (the image brings its own Android SDK).
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
        df -h / | tail -n 1
    - id: tag
      shell: bash
      run: |
        echo "image=$(./build.sh tag)" >> "$GITHUB_OUTPUT"
        { echo 'args<<EOF'; cat tool/versions.env; echo 'EOF'; } >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        context: tool/docker
        file: tool/docker/Dockerfile
        build-args: ${{ steps.tag.outputs.args }}
        tags: ${{ steps.tag.outputs.image }}
        load: true
        cache-from: type=gha,scope=build-image
        cache-to: type=gha,mode=max,scope=build-image
