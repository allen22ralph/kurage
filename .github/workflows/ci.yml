# CI runs once per release: pushing a version tag (v0.3.3) analyzes, tests,
# builds Windows and Android, and publishes a draft GitHub Release with the
# builds. Tests and the analyzer also run on the PC before each commit. A
# run can be started by hand too (Actions > CI > Run workflow).
#
# Every job uses the Flutter and Java versions pinned in tool/versions.env,
# with GitHub's ready-made setup and caches (much quicker than building the
# Docker image ./build.sh uses locally). The builds run alongside the tests;
# nothing is published unless the tests pass too.
name: CI

on:
  push:
    # Not local betas (vX.Y.Z-beta.N-local): built and uploaded on the PC
    # (no CI run), still named like versions so the Releases page sorts them.
    tags: ['v*', '!v*-local']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned versions
        run: cat tool/versions.env >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned versions
        run: cat tool/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Signed with a throwaway key here; tool/release-android.ps1 re-signs
      # a release's APKs with the release key on your PC (no secrets in CI).
      - name: Build
        run: |
          flutter build apk --release --split-per-abi $(bash tool/ci/build_args.sh)
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            name="$(basename "$f")"
            cp "$f" "dist/kurage-android-${name#app-}"
          done
          ls -1 dist
        env:
          # The app's MAL client ID: a repository variable, not a secret
          # (it only names the app to MAL, and is in every build anyway).
          MAL_CLIENT_ID: ${{ vars.MAL_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/kurage-android-*.apk
          retention-days: 14

  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned versions
        shell: bash
        run: cat tool/versions.env >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build
        shell: bash
        run: flutter build windows --release $(bash tool/ci/build_args.sh)
        env:
          MAL_CLIENT_ID: ${{ vars.MAL_CLIENT_ID }}
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath kurage-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: kurage-windows-x64.zip
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    # The tests too: a build is only published when they pass.
    needs: [test, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release-notes
      # The notes people read (in the app's update dialog too), written with
      # the release: release-notes/<tag>.md, written for the people using the
      # app rather than GitHub's list of pull requests.
      - name: Release notes
        run: |
          notes="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cp "$notes" notes.md; else : > notes.md; fi
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist
      # The version in each file's name (kurage-0.4.0-android-…),
      # so a download says which it is. The app's updater goes by the end
      # of the name (-arm64-v8a-release.apk, -windows-x64.zip).
      - name: Version in the file names
        run: |
          version="${GITHUB_REF_NAME#v}"
          for f in dist/kurage-*; do
            mv "$f" "dist/kurage-$version-${f#dist/kurage-}"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Published by tool/release-android.ps1 once the APKs are signed.
          draft: true
